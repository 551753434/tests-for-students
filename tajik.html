<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <title>Тест - Тоҷикӣ</title>
</head>
<body>
  <h1>Тест барои донишҷӯён</h1>

  <form id="quiz-form">
    <div>
      <p>1. Тарҷумаи "бобо" дар забони англисӣ чист?</p>
      <input type="radio" id="q1a1" name="q1" value="0" />
      <label for="q1a1">Father</label><br />
      <input type="radio" id="q1a2" name="q1" value="1" />
      <label for="q1a2">Mother</label><br />
      <input type="radio" id="q1a3" name="q1" value="2" />
      <label for="q1a3">Grandfather</label><br />
      <input type="radio" id="q1a4" name="q1" value="3" />
      <label for="q1a4">Sister</label><br />
    </div>

    <div>
      <p>2. Фарзанди падари шумо?</p>
      <input type="radio" id="q2a1" name="q2" value="0" />
      <label for="q2a1">Mother</label><br />
      <input type="radio" id="q2a2" name="q2" value="1" />
      <label for="q2a2">Grandmother</label><br />
      <input type="radio" id="q2a3" name="q2" value="2" />
      <label for="q2a3">Brother</label><br />
      <input type="radio" id="q2a4" name="q2" value="3" />
      <label for="q2a4">Uncle</label><br />
    </div>

    <button type="button" onclick="checkAnswers()">Ҳисоб кунед</button>
  </form>

  <div id="result" style="margin-top:20px; font-weight:bold;"></div>

  <script>
    function checkAnswers() {
      const correctAnswers = {
        q1: 2, // Grandfather
        q2: 2  // Brother
      };

      let score = 0;
      let total = Object.keys(correctAnswers).length;

      for (const q in correctAnswers) {
        const options = document.getElementsByName(q);
        let answered = false;
        for (const option of options) {
          if (option.checked) {
            answered = true;
            if (parseInt(option.value) === correctAnswers[q]) {
              score++;
            }
            break;
          }
        }
        if (!answered) {
          alert('Лутфан, саволҳоро пурра ҷавоб диҳед!');
          return;
        }
      }

      document.getElementById('result').innerText = Шумо ${score} аз ${total} саволҳоро дуруст додед!;
    }
  </script>
</body>
</html>
