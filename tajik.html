<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <title>Тест - Тоҷикӣ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #2575fc;
      color: white;
      padding: 30px;
      text-align: center;
    }
    .container {
      background: rgba(0,0,0,0.25);
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .question {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin: 12px 0;
      cursor: pointer;
      font-size: 18px;
      text-align: left;
    }
    input[type="radio"] {
      margin-right: 12px;
      transform: scale(1.2);
      cursor: pointer;
    }
    button {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      background: white;
      color: #2575fc;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background: #1a4db7;
      color: white;
    }
    .result {
      font-size: 22px;
      font-weight: bold;
      margin-top: 30px;
    }
    a {
      color: white;
      text-decoration: underline;
      display: inline-block;
      margin-top: 30px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="quiz-container"></div>
    <button id="next-btn">Пас</button>
    <br />
    <a href="index.html">Баргашт ба Саҳифаи Асосӣ</a>
  </div>

<script>
  const quizData = [
    {
      question: 'Тарҷумаи "бобо" дар забони англисӣ чист?',
      options: ['Father', 'Mother', 'Grandfather', 'Sister'],
      correct: 2
    },
    {
      question: 'Фарзанди падари шумо?',
      options: ['Mother', 'Grandmother', 'Brother', 'Uncle'],
      correct: 2
    }
  ];

  let currentQuestion = 0;
  let score = 0;

  const quizContainer = document.getElementById('quiz-container');
  const nextBtn = document.getElementById('next-btn');

  function loadQuestion() {
    const q = quizData[currentQuestion];
    let html = <div class="question">${q.question}</div>;
    q.options.forEach((opt, i) => {
      html += <label><input type="radio" name="option" value="${i}"/>${opt}</label>;
    });
    quizContainer.innerHTML = html;

    nextBtn.textContent = currentQuestion === quizData.length - 1 ? 'Показ додан' : 'Пас';
  }

  function getSelected() {
    const options = document.getElementsByName('option');
    for (const opt of options) {
      if (opt.checked) {
        return Number(opt.value);
      }
    }
    return null;
  }

  nextBtn.onclick = () => {
    const selected = getSelected();
    if (selected === null) {
      alert('Лутфан, як вариантро интихоб кунед!');
      return;
    }

    if (selected === quizData[currentQuestion].correct) {
      score++;
    }

    currentQuestion++;

    if (currentQuestion < quizData.length) {
      loadQuestion();
    } else {
      quizContainer.innerHTML = <div class="result">Шумо ${score} аз ${quizData.length} саволҳоро дуруст додед!</div>;
      nextBtn.style.display = 'none';
    }
  };

  loadQuestion();
</script>

</body>
</html>
