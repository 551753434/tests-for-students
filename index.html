<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to the English Test Page</title>
<style>
    /* Animated gradient background */
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: Arial, sans-serif;
        background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
        background-size: 400% 400%;
        animation: gradient 10s ease infinite;
        color: white;
    }
    @keyframes gradient {
        0% {background-position: 0% 50%;}
        50% {background-position: 100% 50%;}
        100% {background-position: 0% 50%;}
    }
    h1 {
        font-size: 3rem;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.4);
        margin-top: 80px;
        text-align: center;
    }
    .button-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-top: 40px;
    }
    a {
        text-decoration: none;
    }
    .lang-btn {
        padding: 15px 40px;
        font-size: 1.2rem;
        color: white;
        background: rgba(0, 0, 0, 0.4);
        border: 2px solid white;
        border-radius: 30px;
        transition: all 0.3s ease;
        text-align: center;
        box-shadow: 0 0 15px rgba(255,255,255,0.5);
    }
    .lang-btn:hover {
        background: white;
        color: #333;
        box-shadow: 0 0 25px white;
    }
    footer {
        margin-top: auto;
        text-align: center;
        padding: 20px;
        background: rgba(0,0,0,0.3);
        font-size: 0.9rem;
        line-height: 1.4;
    }
    footer a {
        color: #fff;
        text-decoration: underline;
    }
</style>
</head>
<body>
    <h1>Welcome to the English Test Page</h1>
    <div class="button-container">
        <a href="tajik.html" class="lang-btn">Tajik</a>
        <a href="uzbek.html" class="lang-btn">Uzbek</a>
        <a href="russian.html" class="lang-btn">Russian</a>
    </div>
    <footer>
        <p>Created by <strong>Samandar Toshpulatov</strong></p>
        <p>📧 Email: <a href="mailto:samandartoshpulatov511@gmail.com">samandartoshpulatov511@gmail.com</a> | 📱 Phone: +992 55 175 3434</p>
        <p>© 2025 All rights reserved</p>
    </footer>
</body>
</html>
