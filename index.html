<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Test Website - Language Selection</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
<style>
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    position: relative;
  }
  /* Animated background shapes */
  body::before, body::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    opacity: 0.15;
    filter: blur(100px);
    animation: float 8s ease-in-out infinite;
  }
  body::before {
    width: 400px;
    height: 400px;
    background: #ff6a00;
    top: -100px;
    left: -100px;
  }
  body::after {
    width: 300px;
    height: 300px;
    background: #00ffe7;
    bottom: -80px;
    right: -80px;
    animation-delay: 4s;
  }
  header {
    width: 100%;
    padding: 25px 20px;
    text-align: center;
    background: rgba(0, 0, 0, 0.25);
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    backdrop-filter: blur(6px);
  }
  header h1 {
    margin: 0;
    font-weight: 700;
    font-size: 32px;
    letter-spacing: 1.5px;
    text-shadow: 0 2px 5px rgba(0,0,0,0.4);
  }
  header p {
    margin-top: 6px;
    font-size: 15px;
    opacity: 0.85;
  }
  main {
    margin-top: 40px;
    background: rgba(255, 255, 255, 0.12);
    padding: 40px 30px;
    border-radius: 24px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(10px);
    text-align: center;
    width: 320px;
  }
  main h2 {
    margin-bottom: 35px;
    font-size: 24px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  }
  .lang-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 14px 0;
    font-size: 20px;
    font-weight: 600;
    border-radius: 40px;
    border: none;
    cursor: pointer;
    width: 100%;
    background: linear-gradient(45deg, #ff6a00, #ee0979);
    color: white;
    box-shadow: 0 5px 15px rgba(255, 106, 0, 0.6);
    transition: all 0.3s ease;
    animation: float 4s ease-in-out infinite;
  }
  .lang-btn:nth-child(2) {
    background: linear-gradient(45deg, #1fa2ff, #12d8fa, #a6ffcb);
    box-shadow: 0 5px 15px rgba(18, 216, 250, 0.6);
    animation-delay: 1.3s;
  }
  .lang-btn:nth-child(3) {
    background: linear-gradient(45deg, #f7971e, #ffd200);
    box-shadow: 0 5px 15px rgba(255, 210, 0, 0.6);
    animation-delay: 2.6s;
  }
  .lang-btn:hover {
    filter: brightness(1.1);
    transform: scale(1.07);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .lang-btn span.emoji {
    font-size: 24px;
  }
  footer {
    margin-top: auto;
    width: 100%;
    padding: 15px 10px;
    text-align: center;
    background: rgba(0, 0, 0, 0.2);
    font-size: 14px;
    opacity: 0.8;
    color: white;
  }
  @media(max-width: 480px) {
    main {
      width: 90%;
      padding: 30px 20px;
    }
    .lang-btn {
      font-size: 18px;
      padding: 12px 0;
    }
  }
</style>
</head>
<body>
<header>
  <h1>Test Website for Students</h1>
  <p>Created by Samandar Toshpulatov | Contact: samandartoshpulatov511@gmail.com</p>
</header>
<main>
  <h2>Select Your Language / Забонро интихоб кунед / Tilni tanlang / Выберите язык</h2>
  <button class="lang-btn" onclick="location.href='tajik.html'">
    <span class="emoji">🇹🇯</span> Тоҷикӣ (Tajik)
  </button>
  <button class="lang-btn" onclick="location.href='uzbek.html'">
    <span class="emoji">🇺🇿</span> Oʻzbekcha (Uzbek)
  </button>
  <button class="lang-btn" onclick="location.href='russian.html'">
    <span class="emoji">🇷🇺</span> Русский (Russian)
  </button>
</main>
<footer>
  &copy; 2025 Samandar Toshpulatov. All rights reserved.
</footer>
</body>
</html>
