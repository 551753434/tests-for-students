<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maverick English Academy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #004aad, #007bff);
      color: #fff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    header {
      text-align: center;
      padding: 50px 20px 20px;
    }
    header h1 {
      font-size: 2.5em;
      font-weight: 700;
      margin: 0;
    }
    header p {
      font-size: 1.2em;
      opacity: 0.9;
      margin-top: 8px;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    .test-buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .test-btn {
      background-color: white;
      color: #004aad;
      font-weight: 600;
      padding: 15px 30px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 1.1em;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .test-btn:hover {
      background-color: #004aad;
      color: white;
      transform: translateY(-5px);
    }
    .admin-btn {
      background-color: #ffcc00;
      color: #222;
      border: none;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    }
    .admin-btn:hover {
      background-color: #ffaa00;
      transform: translateY(-3px);
    }
    footer {
      padding: 15px;
      text-align: center;
      font-size: 0.9em;
      background: rgba(255, 255, 255, 0.1);
      width: 100%;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

  <header>
    <h1>Maverick English Academy</h1>
    <p>Professional English Grammar Tests – A1 & A2 Levels</p>
  </header>

  <main>
    <div class="test-buttons">
      <a href="a1.html" class="test-btn">A1 Level Test</a>
      <a href="a2.html" class="test-btn">A2 Level Test</a>
    </div>
    <button class="admin-btn" onclick="openAdmin()">Admin Login</button>
  </main>

  <footer>
    © 2025 Maverick English Academy | All Rights Reserved
  </footer>

  <script>
    function openAdmin() {
      const password = prompt("Enter admin password:");
      if (password === "MAVERICK") {
        window.location.href = "admin.html";
      } else if (password) {
        alert("❌ Incorrect password. Access denied.");
      }
    }
  </script>

</body>
</html>
