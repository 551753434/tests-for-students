<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to the English Test Page</title>
<style>
    /* Animated gradient background */
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        font-family: Arial, sans-serif;
        background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
        background-size: 400% 400%;
        animation: gradient 10s ease infinite;
    }

    @keyframes gradient {
        0% {background-position: 0% 50%;}
        50% {background-position: 100% 50%;}
        100% {background-position: 0% 50%;}
    }

    h1 {
        font-size: 3rem;
        color: white;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.4);
        margin-bottom: 40px;
        text-align: center;
    }

    .button-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    a {
        text-decoration: none;
    }

    .lang-btn {
        padding: 15px 40px;
        font-size: 1.2rem;
        color: white;
        background: rgba(0, 0, 0, 0.4);
        border: 2px solid white;
        border-radius: 30px;
        transition: all 0.3s ease;
        text-align: center;
        box-shadow: 0 0 15px rgba(255,255,255,0.5);
    }

    .lang-btn:hover {
        background: white;
        color: #333;
        box-shadow: 0 0 25px white;
    }

    @media (min-width: 600px) {
        .button-container {
            flex-direction: row;
        }
    }
</style>
</head>
<body>

    <h1>Welcome to the English Test Page</h1>

    <div class="button-container">
        <a href="tajik.html" class="lang-btn">Tajik</a>
        <a href="uzbek.html" class="lang-btn">Uzbek</a>
        <a href="russian.html" class="lang-btn">Russian</a>
    </div>

</body>
</html>
