<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Test Website - Language Selection</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.3);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    header h1 {
      margin: 0;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 1px;
    }
    header p {
      margin: 5px 0 0;
      font-size: 14px;
      opacity: 0.8;
    }
    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      padding: 40px 20px;
      text-align: center;
    }
    .lang-btn {
      padding: 15px 40px;
      font-size: 20px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      background: white;
      color: #2575fc;
      font-weight: 600;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
      width: 220px;
    }
    .lang-btn:hover {
      background: #2575fc;
      color: white;
      box-shadow: 0 8px 25px rgba(37, 117, 252, 0.7);
      transform: scale(1.05);
    }
    footer {
      text-align: center;
      padding: 15px;
      background: rgba(0, 0, 0, 0.2);
      font-size: 14px;
      opacity: 0.8;
      color: white;
    }
    @media(max-width: 480px) {
      .lang-btn {
        width: 80%;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Test Website for Students</h1>
    <p>Created by Samandar Toshpulatov | Contact: samandartoshpulatov511@gmail.com</p>
  </header>
  <main>
    <h2>Select Your Language / Забонро интихоб кунед / Tilni tanlang</h2>
    <button class="lang-btn" onclick="location.href='tajik.html'">Тоҷикӣ (Tajik)</button>
    <button class="lang-btn" onclick="location.href='uzbek.html'">Oʻzbekcha (Uzbek)</button>
    <button class="lang-btn" onclick="location.href='russian.html'">Русский (Russian)</button>
  </main>
  <footer>
    &copy; 2025 Samandar Toshpulatov. All rights reserved.
  </footer>
</body>
</html>
