<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A2 Grammar Test – Maverick English Academy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #004aad, #007bff);
      color: #fff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      padding: 40px 20px 10px;
    }

    header h1 {
      font-size: 2em;
      font-weight: 700;
      margin: 0;
    }

    header p {
      font-size: 1.1em;
      opacity: 0.9;
      margin-top: 5px;
    }

    main {
      width: 90%;
      max-width: 700px;
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .question {
      margin-bottom: 25px;
    }

    .question p {
      font-size: 1.1em;
      font-weight: 500;
    }

    label {
      display: block;
      margin-left: 15px;
      margin-top: 6px;
      cursor: pointer;
    }

    button {
      background-color: white;
      color: #004aad;
      font-weight: 600;
      padding: 12px 25px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      margin: 10px 5px;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: #004aad;
      color: white;
      transform: translateY(-3px);
    }

    #result {
      margin-top: 20px;
      font-size: 1.2em;
      font-weight: 600;
    }

    .correct { color: #00ff88; }
    .wrong { color: #ff5555; }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.9em;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <h1>A2 Grammar Test</h1>
    <p>Maverick English Academy</p>
  </header>

  <main id="quiz-container">
    <!-- Questions will appear here -->
  </main>

  <footer>
    <a href="index.html" style="color:white; text-decoration:none;">⬅ Back to Home</a>
  </footer>

  <script>
    const quizData = [
      {
        question: "1. I ___ to the cinema yesterday.",
        options: ["go", "went", "gone"],
        correct: "went"
      },
      {
        question: "2. She ___ taller than her brother.",
        options: ["is", "are", "am"],
        correct: "is"
      },
      {
        question: "3. We have ___ our homework already.",
        options: ["do", "did", "done"],
        correct: "done"
      },
      {
        question: "4. He ___ speak French when he was young.",
        options: ["can", "could", "may"],
        correct: "could"
      },
      {
        question: "5. They ___ to Spain last summer.",
        options: ["travel", "traveled", "travelling"],
        correct: "traveled"
      },
      {
        question: "6. I have ___ seen that movie before.",
        options: ["never", "not", "ever"],
        correct: "never"
      },
      {
        question: "7. She bought ___ than I did.",
        options: ["more apples", "much apples", "most apples"],
        correct: "more apples"
      },
      {
        question: "8. The book is ___ the table.",
        options: ["on", "in", "at"],
        correct: "on"
      },
      {
        question: "9. ___ you ever been to London?",
        options: ["Did", "Have", "Has"],
        correct: "Have"
      },
      {
        question: "10. I think this is the ___ film I have ever watched.",
        options: ["best", "better", "good"],
        correct: "best"
      }
    ];

    const quizContainer = document.getElementById('quiz-container');

    function loadQuiz() {
      quizContainer.innerHTML = '';
      quizData.forEach((q, index) => {
        const questionDiv = document.createElement('div');
        questionDiv.className = 'question';
        questionDiv.innerHTML = `
          <p>${q.question}</p>
          ${q.options.map(opt => `
            <label>
              <input type="radio" name="q${index}" value="${opt}"> ${opt}
            </label>
          `).join('')}
        `;
        quizContainer.appendChild(questionDiv);
      });
      const submitBtn = document.createElement('button');
      submitBtn.textContent = 'Submit Test';
      submitBtn.onclick = checkAnswers;
      quizContainer.appendChild(submitBtn);
      quizContainer.appendChild(document.createElement('div')).id = 'result';
    }

    function checkAnswers() {
      let score = 0;
      quizData.forEach((q, index) => {
        const selected = document.querySelector(input[name="q${index}"]:checked);
        if (selected) {
          const parentP = selected.closest('.question').querySelector('p');
          if (selected.value === q.correct) {
            score++;
            parentP.classList.add('correct');
          } else {
            parentP.classList.add('wrong');
          }
        }
      });
      document.getElementById('result').innerHTML = ✅ You got ${score} out of ${quizData.length} correct.;
    }

    loadQuiz();
  </script>

</body>
</html>
