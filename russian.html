<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Тест - Русский</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.3);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    header h1 {
      margin: 0;
      font-weight: 700;
      font-size: 28px;
    }
    header p {
      margin: 5px 0 0;
      font-size: 14px;
      opacity: 0.8;
    }
    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      padding: 40px 20px;
      text-align: center;
    }
    a.back-btn {
      color: white;
      text-decoration: underline;
      font-weight: 600;
      cursor: pointer;
    }
    footer {
      text-align: center;
      padding: 15px;
      background: rgba(0, 0, 0, 0.2);
      font-size: 14px;
      opacity: 0.8;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h1>Тест для студентов</h1>
    <p>Автор: Самандар Тошпулатов | Контакт: samandartoshpulatov511@gmail.com</p>
  </header>
  <main>
    <h2>Тестовая страница - Русский</h2>
    <p>Мы скоро добавим тесты.</p>
    <a href="index.html" class="back-btn">Вернуться на главную</a>
  </main>
  <footer>
    &copy; 2025 Самандар Тошпулатов. Все права защищены.
  </footer>
</body>
</html>
